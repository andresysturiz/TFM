[tool.poetry]
name = "repo-tfm"
version = "0.1.0"
description = "Repositorio para el TFM de Estadística Aplicada"
authors = ["Andres Ysturiz <andresysturiz@gmail.com>"]
readme = "README.md"
packages = [
    { include = "repo_tfm", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0.0,<3.0.0"
numpy = ">=1.26.0,<2.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
matplotlib = ">=3.8.0,<4.0.0"
seaborn = ">=0.13.0,<0.14.0"
ucimlrepo = ">=0.0.7,<0.0.8"
jupyterlab = ">=4.0.0,<5.0.0"
ipykernel = ">=6.0.0,<7.0.0"
pyreadr = ">=0.5.6,<0.6.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
